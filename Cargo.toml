[package]
name = "goblin-nip05d"
version = "0.1.0"
edition = "2021"
description = "Self-hostable NIP-05 name authority (name@domain -> nostr pubkey)"
license = "Apache-2.0"

[lib]
name = "goblin_nip05d"
path = "src/lib.rs"

[[bin]]
name = "goblin-nip05d"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nostr = { version = "0.44", default-features = false, features = ["std"] }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Name-transfer (offer/claim) support. Only exercised when GOBLIN_ALLOW_TRANSFERS
# is set; the proof-verification crates match grin-proof-watcher so the checks
# are byte-for-byte what the buyer's Grin wallet produced.
async-trait = "0.1"
ed25519-dalek = "2"
bech32 = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

[profile.release]
opt-level = 2
strip = true
